# Render Blueprint: GitHub repo connect karke "New > Blueprint" se deploy karein.
databases:
  - name: agrosmart-db
    plan: free
    databaseName: agrosmart
    user: agrosmart

services:
  - type: web
    name: agrosmart
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn farming.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrosmart-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
